# Developing GitHub Actions Workflow for CI/CD

name: DevOps CICD Pipeline

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - manifests/**

jobs:
  devops-ci:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
      - name: Docker Login
        uses: docker/login-action@v3.5.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build and push Docker images
        uses: docker/build-push-action@v6.18.0
        with:
          file: ./Dockerfile
          tags: king950/devopspython:${{ github.sha }}
          push: true
      - name: Updating image tag inside manifest files
        run: |
          pip install yq
          yq -Yi '.spec.template.spec.containers[0].image = "king950/devopspython:${{ github.sha }}"' ./manifests/02_devopsdep.yaml
      - name: Commit and Push the code
        run: |
          git config user.name "king950e"
          git config user.email "cantupre@gmail.com"
          git commit -am "Upating image tag inside manifests using Actions"
          git push origin main
